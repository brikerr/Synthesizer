<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Panel face gradient -->
    <linearGradient id="panelFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a4a"/>
      <stop offset="100%" stop-color="#2a2a38"/>
    </linearGradient>
    <!-- Panel top (3D) -->
    <linearGradient id="panelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a5a6e"/>
      <stop offset="100%" stop-color="#4a4a5c"/>
    </linearGradient>
    <!-- Panel right side (3D) -->
    <linearGradient id="panelSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#222230"/>
      <stop offset="100%" stop-color="#1a1a26"/>
    </linearGradient>
    <!-- Knob gradient -->
    <radialGradient id="knob" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#888899"/>
      <stop offset="60%" stop-color="#555566"/>
      <stop offset="100%" stop-color="#333344"/>
    </radialGradient>
    <!-- Big knob gradient -->
    <radialGradient id="bigKnob" cx="0.38" cy="0.32" r="0.65">
      <stop offset="0%" stop-color="#999aaa"/>
      <stop offset="50%" stop-color="#666677"/>
      <stop offset="100%" stop-color="#3a3a4a"/>
    </radialGradient>
    <!-- LED glow -->
    <radialGradient id="ledGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#00cc66" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ledGlowRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff4466" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#cc2244" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff4466" stop-opacity="0"/>
    </radialGradient>
    <!-- Jack socket -->
    <radialGradient id="jack" cx="0.45" cy="0.4" r="0.55">
      <stop offset="0%" stop-color="#444455"/>
      <stop offset="40%" stop-color="#222233"/>
      <stop offset="70%" stop-color="#111120"/>
      <stop offset="100%" stop-color="#333344"/>
    </radialGradient>
    <!-- Patch cable glow -->
    <filter id="cableGlow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 3D Panel - right side -->
  <polygon points="52,8 58,5 58,55 52,58" fill="url(#panelSide)"/>
  <!-- 3D Panel - top -->
  <polygon points="8,8 52,8 58,5 14,5" fill="url(#panelTop)"/>
  <!-- Panel face -->
  <rect x="8" y="8" width="44" height="50" rx="2" fill="url(#panelFace)" stroke="#1a1a26" stroke-width="0.8"/>

  <!-- Panel screws (corner details) -->
  <circle cx="12" cy="12" r="1.2" fill="#444455" stroke="#333344" stroke-width="0.3"/>
  <circle cx="48" cy="12" r="1.2" fill="#444455" stroke="#333344" stroke-width="0.3"/>
  <circle cx="12" cy="54" r="1.2" fill="#444455" stroke="#333344" stroke-width="0.3"/>
  <circle cx="48" cy="54" r="1.2" fill="#444455" stroke="#333344" stroke-width="0.3"/>

  <!-- Module label area -->
  <rect x="14" y="13" width="32" height="5" rx="0.5" fill="#1e1e2a" opacity="0.6"/>
  <text x="30" y="17" text-anchor="middle" font-family="monospace" font-size="3.5" font-weight="bold" fill="#00ddaa" letter-spacing="0.8">VCO</text>

  <!-- Big main knob (frequency) -->
  <circle cx="30" cy="29" r="7.5" fill="#1a1a28"/>
  <circle cx="30" cy="29" r="6.5" fill="url(#bigKnob)"/>
  <circle cx="30" cy="29" r="1" fill="#222233"/>
  <!-- Knob indicator line -->
  <line x1="30" y1="29" x2="30" y2="23.5" stroke="#00ff88" stroke-width="1" stroke-linecap="round"/>
  <!-- Knob ring markings -->
  <circle cx="30" cy="29" r="8.5" fill="none" stroke="#555566" stroke-width="0.3" stroke-dasharray="1.2 2.5" opacity="0.5"/>

  <!-- Small knob left (fine tune) -->
  <circle cx="17" cy="28" r="3.5" fill="#1a1a28"/>
  <circle cx="17" cy="28" r="2.8" fill="url(#knob)"/>
  <line x1="17" y1="28" x2="17" y2="25.8" stroke="#ffaa33" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Small knob right (pulse width) -->
  <circle cx="43" cy="28" r="3.5" fill="#1a1a28"/>
  <circle cx="43" cy="28" r="2.8" fill="url(#knob)"/>
  <line x1="43" y1="28" x2="44.2" y2="26.2" stroke="#ff4466" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Waveform selector LEDs -->
  <circle cx="19" cy="38" r="1.3" fill="#111120"/>
  <circle cx="19" cy="38" r="1" fill="#00ff88" opacity="0.9"/>
  <circle cx="19" cy="38" r="2.5" fill="url(#ledGlow)"/>

  <circle cx="26" cy="38" r="1.3" fill="#111120"/>
  <circle cx="26" cy="38" r="0.7" fill="#334455"/>

  <circle cx="33" cy="38" r="1.3" fill="#111120"/>
  <circle cx="33" cy="38" r="0.7" fill="#334455"/>

  <circle cx="40" cy="38" r="1.3" fill="#111120"/>
  <circle cx="40" cy="38" r="1" fill="#ff4466" opacity="0.7"/>
  <circle cx="40" cy="38" r="2.5" fill="url(#ledGlowRed)"/>

  <!-- Waveform icons under LEDs (tiny) -->
  <!-- Sine -->
  <path d="M17,41 Q18,39.5 19,41 Q20,42.5 21,41" fill="none" stroke="#aaaacc" stroke-width="0.5"/>
  <!-- Saw -->
  <path d="M24.5,41.5 L26,40 L26,42 L27.5,40.5" fill="none" stroke="#777799" stroke-width="0.5"/>
  <!-- Triangle -->
  <path d="M31.5,42 L33,40 L34.5,42" fill="none" stroke="#777799" stroke-width="0.5"/>
  <!-- Square -->
  <path d="M38.5,42 L38.5,40 L41.5,40 L41.5,42" fill="none" stroke="#aaaacc" stroke-width="0.5"/>

  <!-- Jack sockets (bottom row - patch points) -->
  <!-- CV In -->
  <circle cx="17" cy="50" r="2.8" fill="url(#jack)" stroke="#555566" stroke-width="0.4"/>
  <circle cx="17" cy="50" r="1.2" fill="#0a0a14"/>
  <!-- FM In -->
  <circle cx="27" cy="50" r="2.8" fill="url(#jack)" stroke="#555566" stroke-width="0.4"/>
  <circle cx="27" cy="50" r="1.2" fill="#0a0a14"/>
  <!-- Output -->
  <circle cx="37" cy="50" r="2.8" fill="url(#jack)" stroke="#555566" stroke-width="0.4"/>
  <circle cx="37" cy="50" r="1.2" fill="#0a0a14"/>

  <!-- Patch cable plugged into output jack -->
  <circle cx="37" cy="50" r="2" fill="#dd3355" opacity="0.85"/>
  <circle cx="37" cy="50" r="0.8" fill="#ff6688"/>
  <!-- Cable dangling down -->
  <path d="M37,52 Q38,56 42,59 Q48,63 52,60" fill="none" stroke="#dd3355" stroke-width="1.5" stroke-linecap="round" filter="url(#cableGlow)"/>

  <!-- Tiny labels under jacks -->
  <text x="17" y="55.5" text-anchor="middle" font-family="monospace" font-size="2" fill="#666688">CV</text>
  <text x="27" y="55.5" text-anchor="middle" font-family="monospace" font-size="2" fill="#666688">FM</text>
  <text x="37" y="55.5" text-anchor="middle" font-family="monospace" font-size="2" fill="#666688">OUT</text>
</svg>
